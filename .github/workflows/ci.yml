name: Contract quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Canonical contract source fingerprint
        run: sha256sum contracts/slaproof.py
      - name: GenVM lint and SDK validation
        run: genvm-lint check contracts/slaproof.py
      - name: Reuse GenVM archive downloaded by official linter
        run: |
          mkdir -p ~/.cache/gltest-direct
          ls -lh ~/.cache/genvm-linter/genvm-universal-*.tar.xz
          cp -n ~/.cache/genvm-linter/genvm-universal-*.tar.xz ~/.cache/gltest-direct/
      - name: Offline and official Direct Mode tests
        run: python -m pytest -q tests/test_offline.py tests/test_direct.py
