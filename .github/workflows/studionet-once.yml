name: One-shot Studionet full consensus
on:
  push:
    paths:
      - .github/workflows/studionet-once.yml
  workflow_dispatch:
jobs:
  studionet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official GenLayer Studio test client
        run: pip install genlayer-test
      - name: Deploy once, then attempt full-consensus SLA verification
        run: gltest --network studionet tests/studionet/test_live.py -v -s
